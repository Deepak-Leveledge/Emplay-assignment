[project]
name = "emplay-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepak-Leveledge", email = "deepakleveledge@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pinecone>=10.2.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
emplay-assignment = "emplay_assignment:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
